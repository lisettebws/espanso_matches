matches:
  # random ticket lines for daily 
  - trigger: "//tickets"
    replace: "{{tickets}}"
    vars:
      - name: tickets
        type: random
        params:
          choices:
            - "All the tickets!"
            - "Tickets, tickets, tickets"
            - "Answer tickets"
            - ":tickets:"
            - ":ticket_:"
            - ":ticket:"
            - ":all_the_tickets:"
            - ":golden_ticket:"
            - ":admission_tickets:"

  - trigger: "//positive"
    replace: "{{positive}}"
    vars:
      - name: positive
        type: random
        params:
          choices:
            - ":frog_dance: *Positive* :frog_dance:"
            - ":turtle_dance: *Positive* :turtle_dance:"
            - ":doge_dance: *Positive* :doge_dance:"
            - ":cat_dance: *Positive* :cat_dance:"
            - ":dancehotdog: *Positive* :dancehotdog:"
            - ":imp_dance: *Positive* :imp_dance:"
            - ":robot_dance: *Positive* :robot_dance:"
            - ":donkey-kong-dance: *Positive* :donkey-kong-dance:"
            - ":gremlin-dance: *Positive* :gremlin-dance:"
            - ":arthur_dance: *Positive* :arthur_dance:"
            - ":chicken-dance: *Positive* :chicken-dance:"
            - ":blob-dance: *Positive* :blob-dance:"
            - ":fire_dance: *Positive* :fire_dance:"
            - ":mario_luigi_dance: *Positive* :mario_luigi_dance:"
            - ":party_blob: *Positive* :party_blob:"
            - ":partywalrus: *Positive* :partywalrus:"
            - ":party_cat: *Positive* :party_cat:"
            - ":party_wombat: *Positive* :party_wombat:"
            - ":partyparrot: *Positive* :partyparrot:"
            - ":bee_party: *Positive* :bee_party:"
            - ":dog_party: *Positive* :dog_party:"
            - ":meow_party: *Positive* :meow_party:"
            - ":yay-tada: *Positive* :yay-tada:"
            - ":slayyyed: *Positive* :slayyyed"
            - ":party-business: *Positive* :party-business:"
            
  - trigger: "//learnemo"
    replace: "{{learned}}"
    vars:
      - name: learned
        type: random
        params:
          choices:
            - ":today_i_learned: *Learned* :today_i_learned:"
            - ":brain_party: *Learned* :brain_party:"
            - ":galaxy_brain: *Learned* :galaxy_brain:"
            - ":learning: *Learned* :learning:"
            - ":noted_rat: *Learned*:noted_rat:"
            - ":noted: *Learned*:noted:"
            - ":shocked_face_with_exploding_head: *Learned* :shocked_face_with_exploding_head:"
            
  - trigger: "//blockers"
    replace: "{{blockers}}"
    vars:
      - name: blockers
        type: random
        params:
          choices:
            - ":blocked: *Blockers* :blocked:"
            - ":minecraft_block_bounce: *Blockers* :minecraft_block_bounce:"
            - ":lesigh: *Blockers* :lesigh:"
            - ":confused_rat: *Blockers* :confused_rat:"
            - ":screamsbq: *Blockers* :screamsbq:"
            - ":sadblob: *Blockers* :sadblob:"
            - ":cat_scream: *Blockers* :cat_scream:"
            
  - trigger: "//today"
    replace: "{{today}}"
    vars:
      - name: today
        type: random
        params:
          choices:
            - ":calendar_today: *Today* :calendar_today:"
            - ":spiral_calendar_pad: *Today* :spiral_calendar_pad:"
            - ":calendar: *Today* :calendar:"
            - ":timer_clock: *Today* :timer_clock:"
            - ":hourglass: *Today* :hourglass:"
            - ":hourglass_flowing_sand: *Today* :hourglass_flowing_sand:"
            - ":list: *Today* :list:"
